name: Build and Deploy Contra

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: 🔨 Remote Compile Go to WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Go Wasm Binary
        run: |
          echo "Starting Go WebAssembly compilation on GitHub..."
          mkdir -p dist
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o dist/contra.wasm ./cmd/wasm
          echo "Compilation successful. Binary size:"
          ls -lh dist/contra.wasm

      - name: Package Web Assets
        run: |
          cp web/index.html dist/index.html
          cp web/style.css dist/style.css
          
          # Copy wasm_exec.js from Go SDK
          if [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" dist/wasm_exec.js
          elif [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/wasm_exec.js
          else
            cp web/wasm_exec.js dist/wasm_exec.js
          fi
          
          # Copy vercel configuration
          if [ -f "vercel.json" ]; then
            cp vercel.json dist/vercel.json
          fi
          
          echo "Build directory prepared:"
          ls -la dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contra-dist
          path: dist/
          retention-days: 14

  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: contra-dist
          path: dist

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ [Notice] VERCEL_TOKEN secret is not set yet in GitHub repository."
            echo "To enable automated GitHub Actions deployment to Vercel:"
            echo "1. Go to https://vercel.com/account/tokens to generate a token."
            echo "2. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to GitHub Secrets."
            echo "Or connect your GitHub repository directly in the Vercel dashboard!"
            exit 0
          fi
          
          echo "Deploying to Vercel via Vercel CLI..."
          npx --yes vercel deploy --prod --prebuilt dist --token "$VERCEL_TOKEN"

  deploy-render:
    name: 🚀 Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ [Notice] RENDER_DEPLOY_HOOK_URL secret is not set yet in GitHub repository."
            echo "To enable automated GitHub Actions deployment to Render:"
            echo "1. In Render Dashboard, open your Service -> Settings -> Deploy Hook."
            echo "2. Copy the Webhook URL and add it as RENDER_DEPLOY_HOOK_URL in GitHub Secrets."
            echo "Or connect your GitHub repository directly in Render via Blueprints (render.yaml)!"
            exit 0
          fi
          
          echo "Triggering Render deployment webhook..."
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy trigger sent successfully!"

  deploy-gh-pages:
    name: 🌐 Deploy to GitHub Pages (Live Demo Fallback)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: contra-dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
